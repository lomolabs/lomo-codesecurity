apiVersion: v1
kind: Pod
metadata:
  name: review-only
spec:
  containers:
    - name: app
      image: example.invalid/review-only:scan-only
      securityContext:
        privileged: true
        runAsNonRoot: false
      volumeMounts:
        - name: host
          mountPath: /host
  volumes:
    - name: host
      hostPath:
        path: /
