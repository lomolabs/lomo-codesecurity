[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kodesec-api"
version = "0.1.0"
description = "Lomo CodeSecurity FastAPI control plane"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.133.0",
  "starlette==1.3.1",
  "uvicorn[standard]==0.32.1",
  "sqlalchemy==2.0.52",
  "psycopg2-binary==2.9.12",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "httpx==0.28.1",
  "prometheus-client==0.21.1",
]

[project.optional-dependencies]
test = [
  "pytest==9.0.3",
  # The exported test lock also supplies the shared make test scanner environment.
  "xxhash==3.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["kodesec_api*"]
