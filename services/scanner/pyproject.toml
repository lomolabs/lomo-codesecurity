[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kodesec-scanner"
version = "0.1.0"
description = "Lomo CodeSecurity scanner service"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.133.0",
  "starlette==1.3.1",
  "uvicorn[standard]==0.32.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "prometheus-client==0.21.1",
  "xxhash==3.6.0",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==9.0.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["kodesec_scanner*"]
